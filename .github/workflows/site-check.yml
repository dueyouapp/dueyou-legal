name: DueYou Legal Site Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.css'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/**'
      - '.github/workflows/site-check.yml'

permissions:
  contents: read

concurrency:
  group: dueyou-legal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Validate static site
        run: python scripts/validate_site.py
