name: Patch V4 compatibility bridge

on:
  push:
    branches:
      - agent/v4-live-compat-bridge
    paths:
      - .github/workflows/v4-compat-bridge-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v4-live-compat-bridge
          fetch-depth: 0
      - name: Patch launcher compatibility bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('kucoin-monitor/index.html')
          text=p.read_text()
          text=text.replace('launcher V4.2','launcher V4.3').replace('LAUNCHER V4.2','LAUNCHER V4.3')
          marker="function validateOrThrow(html){const validation=dashboardValidation(html);if(!validation.ok)throw new Error(`Refusing stale/incomplete dashboard. Missing: ${validation.missing.join(', ')}.`);return html}\n"
          if marker not in text:
              raise SystemExit('validation insertion point missing')
          bridge=r'''function applyKnownV4RuntimeCompatibility(html){
  let text=String(html||''),patched=[];
  const broken="""  function installMarkerAbbreviations(){\n    const lib=L();if(V4.markerWrapped||!lib||typeof lib.createSeriesMarkers!=='function')return;\n    const original=lib.createSeriesMarkers;\n    lib.createSeriesMarkers=function(series,markers,options){\n      const compact=(markers||[]).map(marker=>({...marker,text:compactMarkerText(marker.text),size:Math.min(Number(marker.size||.6),.48)}));\n      return original.call(this,series,compact,options);\n    };\n    lib.createSeriesMarkers.__controlRoomV4=true;V4.markerWrapped=true;\n  }\n""";
  const safe="""  function installMarkerAbbreviations(){\n    // Launcher compatibility bridge for the pre-fix generated V4 artifact.\n    // TradingView's standalone export is frozen; never assign to it.\n    V4.markerWrapped=true;\n  }\n""";
  if(text.includes(broken)){text=text.replace(broken,safe);patched.push('frozen-export');}
  const oldMarkers="const all=[...markers,...evidence,...pattern].sort((a,b)=>Number(a.time)-Number(b.time)).slice(-16);\n      if(all.length&&typeof lib.createSeriesMarkers==='function')lib.createSeriesMarkers(candles,all,{autoScale:false});";
  const compactMarkers="const all=[...markers,...evidence,...pattern].sort((a,b)=>Number(a.time)-Number(b.time)).slice(-16);\n      const compact=all.map(marker=>{const raw=String(marker.text||'').trim(),u=raw.toUpperCase();let t=raw;if(u.includes('CONFIRMED HIGH'))t='CH';else if(u.includes('CONFIRMED LOW'))t='CL';else if(u==='ZONE'||u.includes('ZONE TOUCH'))t='Z';else if(u.includes('IFVG')&&u.includes('HOLD'))t='IH';else if(u.includes('IFVG'))t='IF';else if(u.startsWith('BOS'))t='BOS';else if(u.startsWith('MSS'))t='MSS';else if(u==='HOLD')t='H';else if(raw.length>6)t=raw.slice(0,6);return {...marker,text:t,size:Math.min(Number(marker.size||.6),.48)};});\n      if(compact.length&&typeof lib.createSeriesMarkers==='function')lib.createSeriesMarkers(candles,compact,{autoScale:false});";
  if(text.includes(oldMarkers)){text=text.replace(oldMarkers,compactMarkers);patched.push('compact-markers');}
  const boundary='\n/* CONTROL ROOM V4';
  if(text.includes(boundary)&&!text.includes('</script>\n  <script>\n/* CONTROL ROOM V4')){text=text.replace(boundary,'\n</script>\n  <script>\n/* CONTROL ROOM V4',1);patched.push('script-isolation');}
  window.MONITOR_LAUNCHER_COMPAT_PATCHES=patched;
  return text;
}
'''
          text=text.replace(marker,marker+bridge,1)
          old="const html=await fetchDashboard(token);setStatus(`${REQUIRED_BUILD} verified. Opening…`,'good');history.replaceState(null,'','#terminal');document.open();document.write(injectRuntimeHandshake(html));document.close()"
          new="const html=applyKnownV4RuntimeCompatibility(await fetchDashboard(token));setStatus(`${REQUIRED_BUILD} verified. Opening…`,'good');history.replaceState(null,'','#terminal');document.open();document.write(injectRuntimeHandshake(html));document.close()"
          if old not in text:
              raise SystemExit('loadDashboard patch target missing')
          text=text.replace(old,new,1)
          p.write_text(text)
          PY
      - name: Validate launcher
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('kucoin-monitor/index.html').read_text()
          for marker in ['LAUNCHER V4.3','applyKnownV4RuntimeCompatibility','frozen-export','compact-markers','script-isolation']:
              assert marker in text, marker
          assert "document.write(injectRuntimeHandshake(html))" in text
          print('PASS: V4 compatibility bridge present')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kucoin-monitor/index.html
          git commit -m "fix: bridge pre-fix V4 dashboard runtime"
          git push origin HEAD:agent/v4-live-compat-bridge
