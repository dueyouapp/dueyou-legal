<!doctype html>
<!-- KuCoin Futures private launcher · Control Room V5 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070b">
<title>KuCoin Futures Control Room</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05070b;color:#f4f8fc;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% -10%,rgba(65,215,255,.1),transparent 38%),#05070b}.card{width:min(520px,100%);padding:22px;border:1px solid #1b2836;border-radius:18px;background:#0a0f16;box-shadow:0 20px 70px rgba(0,0,0,.45)}.eyebrow{margin:0 0 7px;color:#41d7ff;font-size:.68rem;font-weight:900;letter-spacing:.12em}h1{margin:0;font-size:1.7rem}p{color:#8797aa;line-height:1.5}.status{margin:17px 0;padding:11px 12px;border:1px solid #223243;border-radius:11px;background:#070b10;color:#b8c5d4;font-size:.82rem;overflow-wrap:anywhere}.status.good{border-color:rgba(39,231,162,.4);color:#a6f8d8}.status.bad{border-color:rgba(255,95,120,.42);color:#ffb3bf}.status.warn{border-color:rgba(246,200,95,.42);color:#ffe09b}.actions{display:flex;gap:8px}button{flex:1;min-height:44px;border:1px solid #28394c;border-radius:10px;background:#0d1721;color:#edf7ff;font-weight:850}.primary{border-color:rgba(65,215,255,.5);background:rgba(65,215,255,.09)}.fine{margin-bottom:0;font-size:.7rem;color:#65758a}@media(max-width:520px){body{padding:12px}.card{padding:18px}.actions{display:grid}}
</style>
</head>
<body>
<main class="card">
<p class="eyebrow">PRIVATE KUCOIN FUTURES · V5</p>
<h1>Control Room</h1>
<p>Loads the newest verified clean dashboard directly from the private monitor repository.</p>
<div id="status" class="status">Checking private dashboard…</div>
<div class="actions">
<button id="open" class="primary" type="button">Open Control Room</button>
<button id="connect" type="button">Connect / replace token</button>
</div>
<p class="fine">GitHub token scope: this repository only, Contents: Read-only. No KuCoin private credential is stored by this launcher.</p>
</main>
<script>
(()=>{'use strict';
const REPO='dueyouapp/kucoin-futures-monitor';
const PATH='dashboard/live.html';
const TOKEN_KEY='kucoin-monitor-github-read-token-v1';
const REQUIRED=['CONTROL ROOM V5','KUCOIN QUANT CONTROL','window.MONITOR_SNAPSHOT','TradingView Lightweight Charts'];
const FORBIDDEN=['CONTROL ROOM V4','MVP HEALTH CONTRACT','terminal_ui.js','command_center_ui.js','mvp_ui.js'];
const status=document.getElementById('status'),open=document.getElementById('open'),connect=document.getElementById('connect');
let busy=false;
const setStatus=(text,tone='')=>{status.textContent=text;status.className='status'+(tone?' '+tone:'')};
const token=()=>{try{return localStorage.getItem(TOKEN_KEY)||''}catch(_){return''}};
const save=v=>{try{localStorage.setItem(TOKEN_KEY,v);return true}catch(_){return false}};
const clear=()=>{try{localStorage.removeItem(TOKEN_KEY)}catch(_){}};
const url=()=>`https://api.github.com/repos/${REPO}/contents/${PATH}?ref=main&ts=${Date.now()}`;
function validate(html){const text=String(html||'');const missing=REQUIRED.filter(x=>!text.includes(x));const legacy=FORBIDDEN.filter(x=>text.includes(x));if(missing.length)throw new Error(`V5 is not deployed yet. Missing: ${missing.join(', ')}.`);if(legacy.length)throw new Error(`Refusing legacy dashboard: ${legacy.join(', ')}.`);return text}
function decode(v){const raw=atob(String(v||'').replace(/\s+/g,''));return new TextDecoder().decode(Uint8Array.from(raw,c=>c.charCodeAt(0)))}
async function fetchDashboard(key){const headers={Accept:'application/vnd.github.raw',Authorization:`Bearer ${key}`,'X-GitHub-Api-Version':'2022-11-28'};let res=await fetch(url(),{cache:'no-store',credentials:'omit',headers});if(res.ok)return validate(await res.text());if([401,403,404].includes(res.status)){clear();const e=new Error('Private repository access failed. Use Connect / replace token.');e.auth=true;throw e}headers.Accept='application/vnd.github+json';res=await fetch(url(),{cache:'no-store',credentials:'omit',headers});if(!res.ok)throw new Error(`GitHub returned HTTP ${res.status}.`);const body=await res.json();return validate(decode(body.content))}
async function load(override=''){if(busy)return;busy=true;open.disabled=connect.disabled=true;try{const key=String(override||token()).trim();if(!key){setStatus('Connect the private GitHub token once on this browser.','warn');return}setStatus('Fetching current Control Room V5…');const html=await fetchDashboard(key);setStatus('V5 verified. Opening…','good');history.replaceState(null,'','#control-room-v5');document.open();document.write(html);document.close()}catch(e){setStatus(e?.message||'Unable to load Control Room V5.','bad')}finally{busy=false;open.disabled=connect.disabled=false}}
async function doConnect(){const value=prompt('Paste the fine-grained GitHub token for dueyouapp/kucoin-futures-monitor with Contents: Read-only permission.');if(!value)return;const key=value.trim();try{setStatus('Verifying repository access…');await fetchDashboard(key);if(!save(key))throw new Error('This browser refused to save the token.');await load(key)}catch(e){if(e?.auth)clear();setStatus(e?.message||'GitHub connection failed.','bad')}}
open.addEventListener('click',()=>load());connect.addEventListener('click',doConnect);if(token())load();else setStatus('Connect the private GitHub token once on this browser.','warn');
})();
</script>
</body>
</html>
